name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            updater_json: true
            asset_pattern: '[name]_[version]_[arch][setup].[ext]'
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app
            release_arch: aarch64
            updater_json: false
            asset_pattern: '[name]_[version]_[arch].[ext]'
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            release_arch: x64
            updater_json: false
            asset_pattern: '[name]_[version]_[arch].[ext]'
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            updater_json: true
            asset_pattern: '[name]_[version]_[arch].[ext]'
    runs-on: ${{ matrix.runner }}
    env:
      DSH_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-dependencies.sh
      - name: 准备工具链
        run: |
          corepack enable
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          gh --version
      - name: 安装依赖
        run: corepack pnpm install --frozen-lockfile
      - name: 验证发布来源
        shell: pwsh
        run: |
          corepack pnpm release:verify -- $env:GITHUB_REF_NAME
          git fetch origin master --depth=1
          $tagCommit = git rev-parse HEAD
          $masterCommit = git rev-parse origin/master
          if ($tagCommit -ne $masterCommit) {
            throw "发布标签必须指向 origin/master 头部：tag=$tagCommit master=$masterCommit"
          }
      - name: 检查 Release 是否可写
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedTag = [Uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          try {
            $release = Invoke-RestMethod -Uri $uri -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $release = $null
          }
          if ($release -and -not $release.draft) {
            throw "Release $env:GITHUB_REF_NAME 已发布，禁止覆盖资产"
          }
      - name: 暂存固定运行时
        run: corepack pnpm runtime:stage -- --target ${{ matrix.target }}
      - name: 准备公开构建信息
        shell: pwsh
        run: |
          $buildTimestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $buildId = (git rev-parse --short=7 HEAD).Trim()
          if ($buildId -notmatch '^[0-9a-f]{7}$') {
            throw "构建标识格式无效：$buildId"
          }
          "DSH_DESKTOP_BUILD_TIMESTAMP=$buildTimestamp" >> $env:GITHUB_ENV
          "DSH_DESKTOP_BUILD_ID=$buildId" >> $env:GITHUB_ENV
      - name: 执行完整检查
        run: corepack pnpm check
      - name: 读取内置 DSH 版本
        shell: pwsh
        run: |
          $runtimeLock = Get-Content -LiteralPath runtime/runtime-lock.json -Raw -Encoding UTF8 | ConvertFrom-Json
          "DSH_VERSION=$($runtimeLock.dsh.version)" >> $env:GITHUB_ENV
      - name: 读取版本更新说明
        shell: pwsh
        run: |
          $notesPath = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "缺少当前版本更新说明：$notesPath"
          }
          $releaseBody = (Get-Content -LiteralPath $notesPath -Raw -Encoding UTF8).Replace('{{DSH_VERSION}}', $env:DSH_VERSION)
          if ($releaseBody -match '\{\{[^}]+\}\}') {
            throw "更新说明仍包含未替换占位符：$notesPath"
          }
          $delimiter = "DSH_RELEASE_NOTES_$env:GITHUB_RUN_ID"
          "RELEASE_BODY<<$delimiter" >> $env:GITHUB_ENV
          $releaseBody >> $env:GITHUB_ENV
          $delimiter >> $env:GITHUB_ENV
      - name: 构建并上传跨平台资产
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DSH Desktop ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: ${{ matrix.updater_json }}
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 生成并上传 macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg_path="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/DSH Desktop_${version}_${{ matrix.release_arch }}.dmg"
          bash scripts/package-macos-dmg.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/DSH Desktop.app" \
            "$dmg_path"
          gh release upload "$GITHUB_REF_NAME" "$dmg_path" --clobber
          echo "MACOS_DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: 上传安装包 SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $paths = @($env:ARTIFACT_PATHS | ConvertFrom-Json)
          if ($env:MACOS_DMG_PATH) { $paths += $env:MACOS_DMG_PATH }
          $packages = $paths | Where-Object {
            $_ -match '\.(exe|dmg|AppImage|deb)$' -and (Test-Path -LiteralPath $_ -PathType Leaf)
          }
          if (-not $packages) { throw '未找到需要生成校验文件的安装包' }
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $release = $releases | Where-Object tag_name -eq $env:GITHUB_REF_NAME | Select-Object -First 1
          if (-not $release) { throw "未找到Draft Release：$env:GITHUB_REF_NAME" }
          $releaseAssets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?per_page=100" | ConvertFrom-Json)
          foreach ($packagePath in $packages) {
            $package = Get-Item -LiteralPath $packagePath
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            # GitHub会规范化带空格的资产名，校验文件必须记录发布页中的实际名称。
            $matchedAssets = @($releaseAssets | Where-Object {
              $_.digest -eq "sha256:$hash" -and $_.size -eq $package.Length
            })
            if ($matchedAssets.Count -ne 1) {
              throw "安装包与GitHub资产匹配异常：$($package.Name)，匹配数量$($matchedAssets.Count)"
            }
            $releaseAsset = $matchedAssets[0]
            $checksumPath = Join-Path $package.DirectoryName "$($releaseAsset.name).sha256"
            Set-Content -LiteralPath $checksumPath -Value "$hash  $($releaseAsset.name)" -Encoding ascii -NoNewline
            gh release upload $env:GITHUB_REF_NAME $checksumPath --clobber
          }

  verify-release:
    name: 校验 Draft Release
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: 下载、规范化并校验更新清单
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          gh release download $env:GITHUB_REF_NAME --pattern latest.json --dir release-assets
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $release = $releases | Where-Object tag_name -eq $env:GITHUB_REF_NAME | Select-Object -First 1
          if (-not $release -or -not $release.draft) { throw '未找到可写的Draft Release' }
          $assets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?per_page=100" | ConvertFrom-Json)
          $assetsJson = ConvertTo-Json -InputObject $assets -Depth 10
          [IO.File]::WriteAllText('release-assets/release-assets.json', $assetsJson, [Text.UTF8Encoding]::new($false))
          node scripts/normalize-updater-manifest.mjs release-assets/latest.json release-assets/release-assets.json --repository $env:GITHUB_REPOSITORY --tag $env:GITHUB_REF_NAME
          gh release upload $env:GITHUB_REF_NAME release-assets/latest.json --clobber
          $version = $env:GITHUB_REF_NAME.Substring(1)
          node scripts/verify-updater-manifest.mjs release-assets/latest.json --version $version --require windows-x86_64-nsis --require linux-x86_64-appimage --forbid-prefix darwin-
      - name: 校验 Draft Release 资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $release = $releases | Where-Object tag_name -eq $env:GITHUB_REF_NAME | Select-Object -First 1
          if (-not $release -or -not $release.draft -or $release.prerelease) { throw 'Release 必须保持为非预发布 Draft' }
          $assets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?per_page=100" | ConvertFrom-Json)
          $names = @($assets | ForEach-Object name)
          $requirements = @(
            @{ Label = 'Windows安装包'; Pattern = '\.exe$'; Minimum = 1 },
            @{ Label = 'Windows更新签名'; Pattern = '\.exe\.sig$'; Minimum = 1 },
            @{ Label = 'macOS DMG'; Pattern = '\.dmg$'; Minimum = 2 },
            @{ Label = 'macOS更新归档'; Pattern = '\.app\.tar\.gz$'; Minimum = 2 },
            @{ Label = 'macOS更新签名'; Pattern = '\.app\.tar\.gz\.sig$'; Minimum = 2 },
            @{ Label = 'Linux AppImage'; Pattern = '\.AppImage$'; Minimum = 1 },
            @{ Label = 'Linux deb'; Pattern = '\.deb$'; Minimum = 1 },
            @{ Label = 'Linux更新签名'; Pattern = '\.AppImage(?:\.tar\.gz)?\.sig$'; Minimum = 1 },
            @{ Label = 'SHA-256校验文件'; Pattern = '\.sha256$'; Minimum = 5 },
            @{ Label = '更新清单'; Pattern = '^latest\.json$'; Minimum = 1 }
          )
          foreach ($requirement in $requirements) {
            $count = @($names | Where-Object { $_ -match $requirement.Pattern }).Count
            if ($count -lt $requirement.Minimum) {
              throw "$($requirement.Label)数量不足：期望至少$($requirement.Minimum)，实际$count"
            }
          }
          # 校验文件内的名称必须能直接匹配用户下载后的GitHub资产名。
          $packageAssets = @($assets | Where-Object name -match '\.(exe|dmg|AppImage|deb)$')
          $checksumAssets = @($assets | Where-Object name -match '\.sha256$')
          if ($checksumAssets.Count -ne $packageAssets.Count) {
            throw "SHA-256校验文件数量与安装包不一致：安装包$($packageAssets.Count)，校验文件$($checksumAssets.Count)"
          }
          foreach ($checksumAsset in $checksumAssets) {
            gh release download $env:GITHUB_REF_NAME --pattern $checksumAsset.name --dir release-assets --clobber
            $checksumPath = Join-Path release-assets $checksumAsset.name
            $parts = (Get-Content -LiteralPath $checksumPath -Raw -Encoding ascii) -split '\s+', 2
            $packageName = $checksumAsset.name.Substring(0, $checksumAsset.name.Length - '.sha256'.Length)
            $matchedPackages = @($packageAssets | Where-Object name -eq $packageName)
            if ($parts.Count -ne 2 -or $matchedPackages.Count -ne 1) {
              throw "SHA-256校验文件格式或安装包匹配异常：$($checksumAsset.name)"
            }
            $expectedHash = $matchedPackages[0].digest -replace '^sha256:', ''
            if ($parts[0] -ne $expectedHash -or $parts[1].Trim() -ne $packageName) {
              throw "SHA-256校验文件内容不匹配：$($checksumAsset.name)"
            }
          }
          Write-Output "Draft Release资产校验通过，共$($names.Count)个资产"
