name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: 准备工具链
        shell: pwsh
        run: |
          corepack enable
          rustup update stable --no-self-update
          rustup default stable
          gh --version
      - name: 安装依赖
        shell: pwsh
        run: corepack pnpm install --frozen-lockfile
      - name: 验证发布来源
        shell: pwsh
        run: |
          corepack pnpm release:verify -- $env:GITHUB_REF_NAME
          git fetch origin master --depth=1
          $tagCommit = git rev-parse HEAD
          $masterCommit = git rev-parse origin/master
          if ($tagCommit -ne $masterCommit) {
            throw "发布标签必须指向 origin/master 头部：tag=$tagCommit master=$masterCommit"
          }
      - name: 检查 Release 是否可写
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedTag = [Uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          try {
            $release = Invoke-RestMethod -Uri $uri -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $release = $null
          }
          if ($release -and -not $release.draft) {
            throw "Release $env:GITHUB_REF_NAME 已发布，禁止覆盖资产"
          }
      - name: 暂存固定运行时
        shell: pwsh
        run: corepack pnpm runtime:stage
      - name: 执行完整检查
        shell: pwsh
        run: corepack pnpm check
      - name: 构建并上传更新资产
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DSH Desktop ${{ github.ref_name }}
          releaseBody: |
            DSH Desktop 是 DeepSeek Harness 的第三方 Windows 桌面封装。

            ## 安装说明

            1. 下载本 Release 的 `DSH Desktop_<版本号>_x64-setup.exe`。
            2. 运行安装程序；这是全机安装，Windows 可能要求管理员权限。
            3. 已有 DSH Profile、模型配置、插件、缓存和凭据不会被迁移或重写。

            目标机器缺少 WebView2 时，安装程序会使用内置引导程序联网安装。

            ## 发布资产

            - `*.exe`：Windows x64 安装包。
            - `*.exe.sha256`：安装包 SHA-256 校验文件。
            - `*.exe.sig`：应用内在线更新验签文件。
            - `latest.json`：在线更新清单。

            ## 已知限制

            - 当前仅提供 Windows x64 安装包。
            - 当前未使用 Windows Authenticode，首次安装可能显示未知发布者或 SmartScreen 提示。
            - 在线更新使用完整安装包，不是增量补丁。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          tauriScript: pnpm tauri
          args: --bundles nsis
      - name: 上传安装包 SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $paths = $env:ARTIFACT_PATHS | ConvertFrom-Json
          $installerPath = $paths |
            Where-Object { $_ -like '*\bundle\nsis\*.exe' } |
            Select-Object -First 1
          if (-not $installerPath) { throw '未找到 NSIS 安装包' }
          $installer = Get-Item -LiteralPath $installerPath
          $checksumPath = "$($installer.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installer.Name)" -Encoding ascii -NoNewline
          gh release upload $env:GITHUB_REF_NAME $checksumPath --clobber
