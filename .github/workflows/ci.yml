name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app
            release_arch: aarch64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            release_arch: x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      DSH_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: 准备工具链
        run: |
          corepack enable
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: 安装依赖
        run: corepack pnpm install --frozen-lockfile
      - name: 暂存固定运行时
        run: corepack pnpm runtime:stage -- --target ${{ matrix.target }}
      - name: 执行完整检查
        run: corepack pnpm check
      - name: 构建原生安装包
        if: runner.os != 'macOS'
        run: corepack pnpm tauri build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign
      - name: 构建 macOS 应用包
        if: runner.os == 'macOS'
        run: corepack pnpm tauri build --verbose --target ${{ matrix.target }} --bundles app --no-sign
      - name: 生成 macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bash scripts/package-macos-dmg.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/DSH Desktop.app" \
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/DSH Desktop_${version}_${{ matrix.release_arch }}.dmg"
